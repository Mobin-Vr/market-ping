name = "market-ping"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# D1 binding. Replace database_id with the value printed by:
#   npx wrangler d1 create market-ping
# The placeholder below is a syntactically valid UUID so `npm run deploy:dry`
# works before the database exists.
[[d1_databases]]
binding = "DB"
database_name = "market-ping"
database_id = "83d9cb6c-405d-4226-989b-bab112e2d3df"

# Queue fan-out: the cron producer enqueues chunk messages, this Worker consumes them.
[[queues.producers]]
queue = "market-ping-broadcast"
binding = "BROADCAST_QUEUE"

# One chunk message per batch => at most CHUNK_SIZE (15) Telegram sends per invocation.
[[queues.consumers]]
queue = "market-ping-broadcast"
max_batch_size = 1
max_concurrency = 2
max_retries = 3

# The ONLY cron trigger: 05:30..17:30 UTC == 09:00..21:00 (13 runs/day).
[triggers]
crons = ["30 5-17 * * *"]

[observability]
enabled = true
